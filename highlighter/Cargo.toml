[package]
name = "vmd-highlighter"
version = "0.1.0"
edition = "2021"

[lib]
name = "vmd_highlighter"
path = "src/lib.rs"

[[bin]]
name = "vmd-highlighter"
path = "src/main.rs"

[dependencies]
inkjet = { version = "0.11", default-features = false, features = ["html", "language-c", "language-cpp", "language-rust", "language-python", "language-javascript", "language-typescript", "language-bash", "language-json", "language-html", "language-css", "language-go", "language-java", "language-scala", "language-swift"] }
tree-sitter-vale = { path = "./tree-sitter-vale" }
