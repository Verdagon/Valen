[package]
name = "tree-sitter-vale"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Vale language grammar for tree-sitter"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
# Runtime crate for the parser-sync tests (tests/sync.rs). Pinned to the same
# 0.23 line the highlighter's inkjet dep uses, so the generated parser.c stays
# ABI-compatible with the runtime that loads it.
tree-sitter = "0.23"
